name: Atualizar Etiquetas

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Executar processamento
        env:
          PROTHEUS_USER: ${{ secrets.PROTHEUS_USER }}
          PROTHEUS_PASSWORD: ${{ secrets.PROTHEUS_PASSWORD }}
        run: python main.py

      - name: Salvar Parquet no repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao nos dados."
          else
            git commit -m "Atualiza dados de etiquetas"
            git push
          fi
